name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Start deploy (detached on server)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "rm -f /var/log/nmffurniture/deploy.done; setsid nohup bash /var/www/nmffurniture/deploy/deploy.sh </dev/null >/dev/null 2>&1 & echo started; exit 0"

      - name: Wait for deploy to finish
        run: |
          for i in $(seq 1 60); do
            RESULT=$(ssh -i ~/.ssh/id_ed25519 \
                -o StrictHostKeyChecking=accept-new \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                "cat /var/log/nmffurniture/deploy.done 2>/dev/null || echo WAITING")
            if [ "$RESULT" = "done" ]; then
              echo "Deploy finished."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for deploy" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Show deploy result
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "cat /var/log/nmffurniture/deploy.status"
